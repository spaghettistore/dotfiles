# Open hovered file with a shell command entered in prompt
# --------------------------------------------------------
# `%h`       is the currently hovered filename, we append that to the end to avoid typing it
# `--block`  acts as yazi default keybind `:`, without `--block` acts as `;`
[[mgr.prepend_keymap]]
on = ["g", ";"]
run = "shell ' %h' --interactive --cursor=0"
desc = "Run a shell command on hovered file"
[[mgr.prepend_keymap]]
on = ["g", ":"]
run = "shell ' %h' --block --interactive --cursor=0"
desc = "Run a shell command on hovered file (block until finishes)"

# Unfiltered searching
# --------------------
# Unfiltered rg
[[mgr.prepend_keymap]]
on = ["g", "S"]
# rg flags:
#   -u   is equivalent to --no-ignore.
#   -uu  is equivalent to --no-ignore --hidden.
#   -uuu is equivalent to --no-ignore --hidden --binary.
run = 'search --via=rg --args="-uu"'
desc = "Search all unfiltered files by contents via rg -uu"
# Unfiltered fd
[[mgr.prepend_keymap]]
on = ["g", "s"]
run = 'search --via=fd --args="-u"'
desc = "Search all unfiltered files via fd -u"

# Swap default `d` and `x`, making `d` cut and `x` send to trash
# --------------------------------------------------------------
# Make `d` cut
[[mgr.prepend_keymap]]
on = "d"
run = "yank --cut"
desc = "Yank selected files (cut)"
# Make `x` delete / send to trash
[[mgr.prepend_keymap]]
on = "x"
run = "remove"
desc = "Trash selected files"

# Make yazi quit without changing terminal's directory by default
# ---------------------------------------------------------------
# Swap the default `q` with `Q` so we don't change terminal's directory
[[mgr.prepend_keymap]]
on = "q"
run = "quit --no-cwd-file"
desc = "Quit without outputting cwd-file"
# Swap the default `Q` with `q` so we do change terminal's directory
[[mgr.prepend_keymap]]
on = "Q"
run = "quit"
desc = "Quit the process"
# Make ctrl+c quit without changing terminal's directory
[[mgr.prepend_keymap]]
on = "<C-c>"
run = "close --no-cwd-file"
desc = "Close the current tab, or quit if it's last"

