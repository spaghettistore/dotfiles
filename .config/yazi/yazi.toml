# Custom open selected files interactively menu for images
[opener]
image_viewer = [
  { run = 'imv-wayland %s', orphan = true, desc = "Image viewer", for = "linux" },
]
edit_image_krita = [
  { run = 'krita %s', orphan = true, desc = "Edit with Krita", for = "linux" },
]
edit_image_gimp = [
  { run = 'gimp %s', orphan = true, desc = "Edit with GIMP", for = "linux" },
]
[open]
prepend_rules = [
  { mime = "image/*", use = [ "open", "image_viewer", "edit_image_krita", "edit_image_gimp" ] },
]
