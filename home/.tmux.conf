# Options
# -------

set -g mouse on
setw -g mode-keys vi
set -g renumber-windows on  # Keep window order sequential e.g. if you have 0,1,2,3 and remove 2 it will become 0,1,2 instead of 0,1,3

# Vanity Colours / Themes
# -----------------------

## Original Status Bar
#set -g status-style "bg=#3c3836 fg=#928374"  # bg="Gruvbox CursorLine", fg="Gruvbox Comment"
#set -g pane-border-style "fg=#3c3836"  # Gruvbox CursorLine
#set -g pane-active-border-style "fg=#689d6a"  # Gruvbox Aqua (Cyan)

## Minimal Status Bar
set -g status-style "bg=default fg=#928374"  # bg="None", fg="Gruvbox Comment"
set -g pane-border-style "fg=#3c3836"  # Gruvbox CursorLine
set -g pane-active-border-style "fg=#689d6a"  # Gruvbox Aqua (Cyan)
set -g status-left ""  # Remove session name from left status bar
set -g status-right "#S %H:%M"  # Make status right the session name and time
set -g window-status-format " #I#F "  # '#I' for window index number. Can also use '#W' for window name. Can use '#F' for format ('-' last win, '*' current win)
set -g window-status-current-format " #I#F "
set -g window-status-bell-style "bg=#cc241d,nobold"  # bg=Gruvbox red
#set -g window-status-current-style "#{?window_zoomed_flag,bg=#d79921 fg=#282828,bg=#928374,nobold fg=#282828}"  # Make window yellow when maximized #d79921=Gruvbox yellow, #282828=Gruvbox BG #928374=Gruvbox Comment
set -g window-status-current-style "bg=#928374,nobold fg=#282828"  # BG #928374=Gruvbox Comment, #282828=Gruvbox 

## UI Colours
set -g mode-style "fg=#282828 bg=#689d6a"  # This is the cursorline in menus from prefix w and prefix s. fg=Gruvbox FG, bg=Gruvbox Cyan
set -g message-style "fg=#282828 bg=#689d6a"  # This is the text input line
set -g message-command-style "fg=#689d6a bg=#282828"  # This is the text input line when in command mode weh using 'mode keys' is set to 'vi'
set -g menu-selected-style "fg=#282828 bg=#689d6a"  # This is the cursorline in display-menus from prefix < and prefix >. fg=Gruvbox FG, bg=Gruvbox Cyan


# Nvim Specific Options
# ---------------------

## Fix slow esc change mode nvim (use low value, not: escape-time 0)
# Recommended by neovim ':checkhealth':
    #- ERROR: `escape-time` (500) is higher than 300ms
    #  - ADVICE:
    #    - set escape-time in ~/.tmux.conf:
    #        set-option -sg escape-time 10
set-option -sg escape-time 10

## Fix nvim 'termguicolors' inside tmux
# Recommended by neovim ':checkhealth':
    #- WARNING: Neither Tc nor RGB capability set. True colors are disabled. |'termguicolors'| won't work properly.
    #  - ADVICE:
    #    - Put this in your ~/.tmux.conf and replace XXX by your $TERM outside of tmux:
    #        set-option -sa terminal-overrides ',XXX:RGB'
    #    - For older tmux versions use this instead:
    #        set-option -ga terminal-overrides ',XXX:Tc'
set-option -ga terminal-overrides ",$TERM:Tc"

#- WARNING `focus-events` is not enabled. |'autoread'| may not work.
#  - ADVICE:
#    - (tmux 1.9+ only) Set `focus-events` in ~/.tmux.conf:
set-option -g focus-events on


# Keybinds
# --------

## Prefix / Leader key
set-option -g prefix C-b
#set-option -g prefix2 C-a
set-option -g prefix2 C-Space

bind-key v split-window -h

## Movement
### Leader hjkl
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
# Rebind last-window (as default is C-b l)
bind-key ^ last-window

### Alt-[hjkl] without prefix to switch panes
#bind -n M-h select-pane -L
#bind -n M-j select-pane -D
#bind -n M-k select-pane -U
#bind -n M-l select-pane -R

### Alt-arrowkeys without prefix to switch windows
#bind -n M-Left previous-window
#bind -n M-Right next-window

## Vim copy and visual mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Scripts
# -------

bind-key Enter run-shell "~/.config/tmux/tmux_new_pane_auto_tile.sh"
bind-key J run-shell "~/.config/tmux/tmux_join_pane_auto_tile.sh"

## Popup Scripts
bind-key g display-popup -w 80% -h 80% -E "~/.config/tmux/tmux_fzcd.sh"
bind-key f display-popup -w 80% -h 80% -E "~/.config/tmux/tmux_fzed.sh"
bind-key W display-popup -w 80% -h 80% -E "~/.config/tmux/tmux_windows.sh"
bind-key S display-popup -w 80% -h 80% -E "~/.config/tmux/tmux_sessions.sh"
bind-key O display-popup -w 80% -h 80% -E "~/.config/tmux/tmux_fzf_editor_new_pane.sh"

bind-key a display-menu -T "Find Files" \
    "Current Directory" "." { display-popup -w 80% -h 80% -E "~/.config/tmux/tmux_fzf_editor_new_pane.sh" } \
    "Home" h { display-popup -w 80% -h 80% -E "~/.config/tmux/tmux_fzf_editor_new_pane.sh ~" } \
    "Inbox" i { display-popup -w 80% -h 80% -E "~/.config/tmux/tmux_fzf_editor_new_pane.sh ~/inbox" } \
    "Projects" p { display-popup -w 80% -h 80% -E "~/.config/tmux/tmux_fzf_editor_new_pane.sh ~/projects" } \
    "Refs" r { display-popup -w 80% -h 80% -E "~/.config/tmux/tmux_fzf_editor_new_pane.sh ~/refs" } \
    "Dotfiles" d { display-popup -w 80% -h 80% -E "~/.config/tmux/tmux_fzf_editor_new_pane.sh ~/dotfiles" }
bind-key F display-menu -T "Find Files" \
    "Current Directory" "." { display-popup -w 80% -h 80% -E "~/.config/tmux/tmux_fzed.sh" } \
    "Home" h { display-popup -w 80% -h 80% -E "~/.config/tmux/tmux_fzed.sh ~" } \
    "Inbox" i { display-popup -w 80% -h 80% -E "~/.config/tmux/tmux_fzed.sh ~/inbox" } \
    "Projects" p { display-popup -w 80% -h 80% -E "~/.config/tmux/tmux_fzed.sh ~/projects" } \
    "Refs" r { display-popup -w 80% -h 80% -E "~/.config/tmux/tmux_fzed.sh ~/refs" } \
    "Dotfiles" d { display-popup -w 80% -h 80% -E "~/.config/tmux/tmux_fzed.sh ~/dotfiles" }
bind-key G display-menu -T "Git" \
    "Status (Short)" s { display-popup -w 80% -h 80% -E "git status -s | less" } \
    "Status (Full)" S { display-popup -w 80% -h 80% -E "git status | less" } \
    "Difftool" d { new-window -n "difftool" "git difftool" } \
    "Difftool (Staged)" D { new-window -n "difftool" "git difftool --staged" } \
    "Log" l { display-popup -w 80% -h 80% -E "git log --oneline | less" } \
    "Log (Full)" L { display-popup -w 80% -h 80% -E "git log | less" }

## New Window Scripts
bind D neww -c "#{pane_current_path}" "[[ -e todo.md ]] && ~/.config/tmux/tmux_fzed.sh todo.md || ~/.config/tmux/tmux_fzed.sh ~/projects/todo.txt"
#bind-key N run-shell "~/.config/tmux/tmux_fzcd.sh ~/inbox ; ~/.config/tmux/tmux_fzed.sh ~/inbox/notepad.txt"
bind-key N run-shell "~/.config/tmux/tmux_fzed.sh ~/inbox/notepad.txt"

## Change directory
bind-key I run-shell "~/.config/tmux/tmux_fzcd.sh ~/inbox"
bind-key P run-shell "~/.config/tmux/tmux_fzcd.sh ~/projects"
bind-key B run-shell "~/.config/tmux/tmux_fzcd.sh ~/bin"
bind-key H run-shell "~/.config/tmux/tmux_fzcd.sh ~"
