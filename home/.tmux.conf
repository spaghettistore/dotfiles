# Options
# -------

set -g mouse on
setw -g mode-keys vi
set -g renumber-windows on  # Keep window order sequential e.g. if you have 0,1,2,3 and remove 2 it will become 0,1,2 instead of 0,1,3
# Start windows at 1, not 0
set -g base-index 1
# Start panes at 1, not 0
setw -g pane-base-index 1

# Vanity Colours / Themes
# -----------------------

## Original Status Bar
#set -g status-style "bg=#3c3836 fg=#928374"  # bg="Gruvbox CursorLine", fg="Gruvbox Comment"
#set -g pane-border-style "fg=#3c3836"  # Gruvbox CursorLine
#set -g pane-active-border-style "fg=#689d6a"  # Gruvbox Aqua (Cyan)

## Minimal Status Bar
set -g status-style "bg=#282828 fg=#928374"  # bg="Gruvbox BG", fg="Gruvbox Comment"
set -g pane-border-style "fg=#3c3836"  # Gruvbox CursorLine
set -g pane-active-border-style "fg=#689d6a"  # Gruvbox Aqua (Cyan)
set -g status-left ""  # Remove session name from left status bar
set -g window-status-format " #I#F "  # '#I' for window index number, '#F' for format ('-' last win, '*' current win, 'M' for marked, 'Z' for zoomed/fullscreen)
set -g window-status-current-format " #I#F "
set -g status-right "#S:#W %H:%M "  # Make status right the session name and window name, can use '%H:%M' for time
set -g status-right-length 80  # Extend the length of status-right (so large window/session names don't squash the time)
set -g window-status-bell-style "bg=#cc241d,nobold"  # bg=Gruvbox red
#set -g window-status-current-style "#{?window_zoomed_flag,bg=#d79921 fg=#282828,bg=#928374,nobold fg=#282828}"  # Make window yellow when maximized #d79921=Gruvbox yellow, #282828=Gruvbox BG #928374=Gruvbox Comment
set -g window-status-current-style "bg=#928374,nobold fg=#282828"  # BG #928374=Gruvbox Comment, #282828=Gruvbox 

## UI Colours
set -g mode-style "fg=#282828 bg=#689d6a"  # This is the cursorline in menus from prefix w and prefix s. fg=Gruvbox FG, bg=Gruvbox Cyan
set -g message-style "fg=#282828 bg=#689d6a"  # This is the text input line
set -g message-command-style "fg=#689d6a bg=#282828"  # This is the text input line when in command mode weh using 'mode keys' is set to 'vi'
set -g menu-selected-style "fg=#282828 bg=#689d6a"  # This is the cursorline in display-menus from prefix < and prefix >. fg=Gruvbox FG, bg=Gruvbox Cyan


# Nvim Specific Options
# ---------------------

## Fix slow esc change mode nvim (use low value, not: escape-time 0)
# Recommended by neovim ':checkhealth':
    #- ERROR: `escape-time` (500) is higher than 300ms
    #  - ADVICE:
    #    - set escape-time in ~/.tmux.conf:
    #        set-option -sg escape-time 10
set-option -sg escape-time 10

## Fix nvim 'termguicolors' inside tmux
# Recommended by neovim ':checkhealth':
    #- WARNING: Neither Tc nor RGB capability set. True colors are disabled. |'termguicolors'| won't work properly.
    #  - ADVICE:
    #    - Put this in your ~/.tmux.conf and replace XXX by your $TERM outside of tmux:
    #        set-option -sa terminal-overrides ',XXX:RGB'
    #    - For older tmux versions use this instead:
    #        set-option -ga terminal-overrides ',XXX:Tc'
set-option -ga terminal-overrides ",$TERM:Tc"

#- WARNING `focus-events` is not enabled. |'autoread'| may not work.
#  - ADVICE:
#    - (tmux 1.9+ only) Set `focus-events` in ~/.tmux.conf:
set-option -g focus-events on


# Keybinds
# --------

## Prefix / Leader key
set-option -g prefix C-b
#set-option -g prefix2 C-a
set-option -g prefix2 C-Space

## Source .tmux.conf
bind-key C-r source-file "~/.tmux.conf" \; display "Sourced ~/.tmux.conf"

## Vim copy and visual mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
# Acts like vim 'y$' / nvim default 'Y'
bind-key -T copy-mode-vi 'Y' send-keys -X begin-selection \; send-keys -X end-of-line \; send-keys -X copy-selection-and-cancel

## Movement
### Leader hjkl
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
### Rebind last-window (as default is C-b l)
bind-key ^ last-window

### Alt-[hjkl] without prefix to switch panes
#bind -n M-h select-pane -L
#bind -n M-j select-pane -D
#bind -n M-k select-pane -U
#bind -n M-l select-pane -R

### Alt-arrowkeys without prefix to switch windows
#bind -n M-Left previous-window
#bind -n M-Right next-window

bind-key Tab next-window
bind-key BTab previous-window  # Shift+Tab

# Scripts
# -------

## Auto tile scripts
bind-key Enter run-shell "~/.config/tmux/tmux_new_pane_auto_tile.sh"
bind-key J run-shell "~/.config/tmux/tmux_join_pane_auto_tile.sh"  # Mark pane with 'prefix m', move to desired window, use keybind to join

## Popup Scripts
bind-key g display-popup -w 80% -h 80% -E "~/.config/tmux/tmux_fzf_directory_picker.sh"
bind-key f display-popup -w 80% -h 80% -E "~/.config/tmux/tmux_fzf_file_picker.sh -o window"
bind-key a display-popup -w 80% -h 80% -E "~/.config/tmux/tmux_fzf_file_picker.sh -o pane"
bind-key C-w display-popup -w 80% -h 80% -E "~/.config/tmux/tmux_windows.sh"
bind-key C-s display-popup -w 80% -h 80% -E "~/.config/tmux/tmux_sessions.sh"

## Display-menu scripts
bind-key C-f run-shell "~/.config/tmux/tmux_fzf_file_picker.sh -mo window"
bind-key C-a run-shell "~/.config/tmux/tmux_fzf_file_picker.sh -mo pane"
bind-key C-g run-shell "~/.config/tmux/git_script.sh display-menu"

## New Window Scripts
bind C-d neww -c "#{pane_current_path}" "[[ -e todo.md ]] && ~/.config/tmux/tmux_fzf_file_picker.sh -o window todo.md || ~/.config/tmux/tmux_fzf_file_picker.sh -o window ~/projects/todo.txt"
bind-key C-n run-shell "~/.config/tmux/tmux_fzf_file_picker.sh -o window ~/inbox/notepad.txt"

## Change directory
bind-key I run-shell "~/.config/tmux/tmux_fzf_directory_picker.sh ~/inbox"
bind-key P run-shell "~/.config/tmux/tmux_fzf_directory_picker.sh ~/projects"
bind-key R run-shell "~/.config/tmux/tmux_fzf_directory_picker.sh ~/resources"
bind-key B run-shell "~/.config/tmux/tmux_fzf_directory_picker.sh ~/.local/bin"
bind-key H run-shell "~/.config/tmux/tmux_fzf_directory_picker.sh ~"
